<VirtualHost *:8080>
  ServerName ${SERVER_NAME}
  DocumentRoot "/var/www/html/"
  <Directory "/var/www/html/">
    Require all denied
  </Directory>
  SetEnvIf Request_URI "^/_health$" health_check
  CustomLog /proc/self/fd/1 combined env=!health_check
  ErrorLog /proc/self/fd/2
  # This lets certain DAV methods work behind an SSL reverse proxy.
  RequestHeader edit Destination ^https http early

  # Security headers — applied to all responses ("always" covers errors too).
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "no-referrer"

</VirtualHost>